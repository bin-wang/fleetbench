name: Fleetbench CI for cross-compiling for RISC-V on x86_64 using the GCC toolchain

on:
  push:
    branches: [riscv]
  pull_request:
    branches: [riscv]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25  # v22

      - name: Build all targets
        run: |
          nix develop .#gcc --ignore-env --command bazelisk build --config=riscv-gcc //...
